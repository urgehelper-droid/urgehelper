function openScience(){
  sheet(`<div class="sheet-top"><p class="mono">The science</p>${X}</div><h2>The research behind every step.</h2>
    <p class="sub">Here’s the research each step is built on, starting with studies on porn itself. Tap a title to read it yourself.</p>
    <p class="mono" style="margin-top:6px">How your path is chosen</p>
    <p class="sub">Every session starts the same way: check in, step away from where you were (Hallberg et al. 2019; Bőthe et al. 2021), name what led here, and call out the excuses the urge makes, swapping each for what’s actually true, the way CBT programs teach (Allen et al. 2017; Bőthe et al. 2021). Then 20 pushups, because short, hard exercise cuts cravings fastest (Haasova et al. 2013). Next come two steps picked for what set you off (below), and every path includes stacking blocks, the only craving game tested on sex cravings too (Skorka-Brown et al. 2015). Every session then closes the same way: think through how you’d feel afterwards, which cut cravings by about a third (Kober et al. 2010), ride out what’s left of the urge (Crosby &amp; Twohig 2016; Holas et al. 2020), think about what matters (Todorovic et al. 2023), and make an if-then plan (Gollwitzer &amp; Sheeran 2006). Before your plan, you write it out, because tracking what happened, especially on paper, helps people reach their goals (Harkin et al. 2016). If the urge is still strong at the end, you can keep going with a brisk walk, which held cravings down for close to an hour (Taylor &amp; Katomeri 2007).</p>
    <p class="sub">How strong the urge is matters too. Distraction works better than reflection when emotions run high (Sheppes et al. 2011, 2014). So your path is set by two things. First, how strong it is. At 6 out of 10 or above, you also turn on a content blocker or Screen Time limit right away. Cutting off easy access is a core move in the CBT programs (Hallberg et al. 2019; Bőthe et al. 2021). Your movement round runs longer, because steady moderate effort is what cuts cravings, more than going all out (Haasova et al. 2014). Distracting steps come first. A silent muscle hold is added, since holds cut cravings too (Ussher et al. 2006). And riding it out comes before thinking it through. Demanding tasks like the blocks beat simple distraction (Dodds et al. 2019), which is why they’re in every path. Second, what set it off decides the two middle steps:</p>
    <div class="tracks">${TRIGGERS.map(t=>`<div class="track"><b>${t.t}</b><span class="mono">Milder · ${t.path.map(id=>STEP_INFO[id].label).join(' · ')}</span><span class="mono">6 or above · ${t.hi.map(id=>STEP_INFO[id].label).join(' · ')} · Hold it</span><p>${t.why}</p></div>`).join('')}</div>
    <div>${PAPERS.map(([step,title,cite,doi,find])=>`<div class="paper"><span class="mono">${step}</span><a href="${doi.startsWith('http')?doi:'https://doi.org/'+doi}" target="_blank" rel="noopener">${title}</a><span class="cite">${cite}</span><p class="find">${find}</p></div>`).join('')}
</div>
    <p class="mono" style="margin-top:6px">Read this before you trust the numbers</p>
    <ul><li>The individual techniques have evidence. This exact sequence hasn’t been tested as a whole.</li><li>Most of the craving research is on smoking, alcohol and food. The mechanisms likely carry over, but treat effect sizes as estimates.</li><li>These steps shorten urges and make them easier to ride out. They don’t make them disappear.</li><li>A self-help tool, not medical treatment.</li></ul>`);
}
$$('[data-sci]').forEach(b=>b.onclick=openScience);

function renderDash(){
  const u=app.user, log=Store.get('sessions',[]), wk=Date.now()-7*DAY;
  const rated=log.filter(x=>x.ratings&&x.ratings.start!=null&&x.ratings.end!=null);
  const drop=rated.length?Math.round(rated.reduce((a,x)=>a+(x.ratings.start-x.ratings.end),0)/rated.length*10)/10:null;
  $('#dHi').textContent=`Hey, ${u.name}.`;
  $('#dFaced').textContent=log.length; $('#dWeek').textContent=log.filter(x=>x.start>wk).length;
  $('#dDrop').textContent=drop==null?'–':Math.max(0,drop);
  /* name their most common trigger once there's enough to see a pattern */
  const c={}; log.forEach(x=>{ if(x.trigger) c[x.trigger]=(c[x.trigger]||0)+1; }); const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
  const tr=top&&top[1]>=3?TRIGGERS.find(t=>t.k===top[0]):null, note=$('#dNote');
  note.hidden=!tr; if(tr) note.innerHTML=`Your most common trigger is <b>${esc(tr.t.toLowerCase())}</b>. Your plan for it: ${esc(tr.then.toLowerCase())}.`;
  $('#dPledge').textContent=u.pledge;
  $('#meBtn').textContent=(u.name[0]||'?').toUpperCase();
  const n=Store.get('journal',[]).length; $('#dJournal').textContent=n?`Journal · ${n}`:'Journal';
}

function refreshHome(animate=true){
  document.body.classList.toggle('on-dash',!!app.user&&app.view==='dash');
  requestAnimationFrame(layoutHero);
  const u=app.user; if(!u) app.view='home'; const v=app.view;
  const show=v==='dash'?$('#dash'):$('#home'), hide=v==='dash'?$('#home'):$('#dash');
  $$('[data-home]').forEach(b=>b.setAttribute('aria-current',v==='home'?'page':'false'));
  const lb=$('#loginBtn');
  if(u){ lb.className='avatar-btn'; lb.textContent=(u.name[0]||'?').toUpperCase(); lb.setAttribute('aria-label','Your profile'); }
  else { lb.className='chip-btn'; lb.textContent='Log in'; lb.removeAttribute('aria-label'); }
  if(v==='dash'){ renderDash(); }
  else { Orb.start(); Sky.to(0,1400); }
  const n=$('#homeNote'); n.hidden=!(v==='home'&&sessionsToday()>=3); n.textContent='Rough day. If it keeps up like this, a therapist who does CBT or ACT can really help.';
  if(animate&&!hide.hidden&&show.hidden){
    hide.classList.add('out');
    setTimeout(()=>{ hide.hidden=true; hide.classList.remove('out'); (v==='dash'?Orb:Streak).stop();
      show.classList.add('out'); show.hidden=false; show.scrollTop=0; layoutHero(); void show.offsetWidth; setTimeout(()=>show.classList.remove('out'),20); },380);
  } else { hide.hidden=true; show.hidden=false; (v==='dash'?Orb:Streak).stop(); layoutHero(); }
}
refreshHome(false);
/* offline support, https only so local testing never serves stale files */
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
